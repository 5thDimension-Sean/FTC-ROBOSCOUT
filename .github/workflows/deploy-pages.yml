name: Deploy web to GitHub Pages

# NOTE: GitHub Pages on a PRIVATE repo requires GitHub Pro (or making the repo
# public). The deployed site itself is public, so the FTC API credentials
# bundled below are extractable from the shipped JS — use a key you can rotate.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Export web build
        env:
          EXPO_PUBLIC_FTC_API_USERNAME: ${{ secrets.EXPO_PUBLIC_FTC_API_USERNAME }}
          EXPO_PUBLIC_FTC_API_KEY: ${{ secrets.EXPO_PUBLIC_FTC_API_KEY }}
        run: npx expo export --platform web
      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
